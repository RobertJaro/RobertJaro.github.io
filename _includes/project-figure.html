<figure class="research-figure">
  <a href="{{ include.image | relative_url }}" aria-label="Open full-size figure: {{ include.alt | escape }}">
    <img src="{{ include.image | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy" decoding="async">
  </a>
  <figcaption>
    {{ include.caption | escape }}
    <a href="{{ include.source_url | escape }}">{{ include.source_label | escape }}</a>.
  </figcaption>
</figure>
